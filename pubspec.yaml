name: mnn_pocket_chat
description: "Pocket Chat - a local MNN chat client for Android."
publish_to: "none"
version: 1.3.0+19

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  dynamic_color: 1.8.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models.json
    - assets/logos/
